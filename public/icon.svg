<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Glowing rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4" />
  <!-- Main glowing core -->
  <circle cx="256" cy="256" r="88" fill="url(#orbGrad)" filter="url(#glow)" />
  <!-- Inner specular reflection -->
  <ellipse cx="230" cy="220" rx="35" ry="20" fill="#ffffff" fill-opacity="0.35" transform="rotate(-20 230 220)" />
  <!-- Soundwave overlay -->
  <path d="M 216 256 Q 236 210, 256 256 T 296 256" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>
